AWSTemplateFormatVersion: '2010-09-09'
Description: Movie Watchlist DynamoDB Tables Only (AWS Academy Compatible)

Resources:

  WatchlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MovieWatchlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  RatingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MovieRatings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

Outputs:
  WatchlistTableName:
    Value: MovieWatchlist
  RatingsTableName:
    Value: MovieRatings
