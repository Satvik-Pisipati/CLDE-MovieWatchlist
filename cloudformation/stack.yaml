AWSTemplateFormatVersion: "2010-09-09"
Description: MovieWatchlist Backend Stack

Resources:

  MovieWatchlistTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MovieWatchlist
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  MovieRatingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MovieRatings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE